on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: |
            any::covr
            any::Rcpp
            any::RcppXsimd
            any::RcppArmadillo
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            any::testthat
          needs: coverage

      - name: Test coverage
        run: |
          run_coverage <- function() {
            # clean = FALSE: with the default (TRUE) covr unlinks its temp
            # install dir on exit, which is where the failure output lives.
            cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
            covr::to_cobertura(cov)
          }
          tryCatch(run_coverage(), error = function(e) {
            # covr echoes only the last lines of Rout.fail and R deletes its
            # tempdir on exit, so copy the file out while it still exists, and
            # echo it into the step log.
            fails <- list.files(tempdir(), pattern = "testthat\\.Rout\\.fail$",
                                recursive = TRUE, full.names = TRUE)
            if (length(fails)) {
              dest <- "testthat-failures"
              dir.create(dest, showWarnings = FALSE)
              file.copy(fails, dest, overwrite = TRUE)
              cat("\n===== kept", length(fails), "failure file(s) =====\n")
            } else {
              cat("\n===== no Rout.fail found under", tempdir(), "=====\n")
            }
            for (f in fails) {
              cat("\n===== ", f, " =====\n", sep = "")
              cat(readLines(f, warn = FALSE), sep = "\n")
            }
            stop(e)
          })
        shell: Rscript {0}

      - name: Keep test failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testthat-failures
          path: testthat-failures/
          if-no-files-found: ignore

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          file: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
