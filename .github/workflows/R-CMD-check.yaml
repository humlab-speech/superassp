# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2.12.1

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libgsl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gsl

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rtools = Get-ChildItem C:\ -Filter 'rtools*' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if (-not $rtools) { throw 'No Rtools installation found on C:\' }
          & "$($rtools.FullName)\usr\bin\pacman.exe" -Sy --noconfirm mingw-w64-ucrt-x86_64-gsl

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppXsimd
            any::RcppArmadillo
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2.12.1
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          # Keep this at "error" and enforce warning policy below so that
          # only documented, justified WARNINGs can pass.
          error-on: '"error"'

      - name: Fail on unexpected R CMD check WARNINGs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=$(find check -name 00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No 00check.log found; nothing to inspect."
            exit 0
          fi

          # Add check-name regexes here only if they are documented and justified.
          #
          # - "code/documentation mismatches": every trk_*/lst_* export is turned
          #   into an S7 generic at .onLoad() (R/s7_methods.R), so its *installed*
          #   runtime signature is always (listOfFiles, ...). Rd docs intentionally
          #   keep the full, pre-conversion parameter list (via explicit @usage) so
          #   users see real arguments -- codoc comparing docs to the post-conversion
          #   generic will always disagree. Trading doc quality for this check is
          #   the wrong call; see PR fixing R-CMD-check.yaml error-on quoting.
          # - "GNU extensions in Makefiles": src/Makevars needs ifeq/$(shell) for
          #   cross-platform macOS SDK header detection (real Xcode 16+ issue), and
          #   the bundled SPTK/opensmile third-party build systems use GNU make
          #   extensions we do not control (vendored, not superassp source).
          # - "pragmas in C/C++ headers and code": diagnostic-suppressing pragmas
          #   live in bundled openSMILE source (src/opensmile/), not superassp code.
          # - "compiled code": printf/stderr/rand-family symbols originate from the
          #   bundled SPTK/openSMILE/tandem third-party DSP libraries' own object
          #   files, not superassp's own C/C++ sources.
          # - "whether package .* can be installed": compiling SPTK + openSMILE +
          #   ESTK + tandem + libassp from source is genuinely slow on shared CI
          #   runners; this reflects build time, not a correctness problem.
          # - "compilation flags in Makevars" / "compilation flags used": PKG_CXXFLAGS
          #   carries -Wno-register/-Wno-deprecated-register, which is NOT cosmetic --
          #   bundled third-party code (e.g. SPTK/third_party/Snack/jkGetF0.cc) uses
          #   the C++-removed 'register' keyword, which some compilers (Apple Clang)
          #   treat as a hard error under -std=c++17 without this suppression.
          allowed='(code/documentation mismatches|GNU extensions in Makefiles|pragmas in C/C\+\+ headers and code|compiled code|whether package .* can be installed|compilation flags (in Makevars|used))'

          all_warnings=$(grep -E '^\* checking .*\.\.\. WARNING' "$log" || true)
          if [ -z "$all_warnings" ]; then
            echo "No R CMD check WARNINGs found."
            exit 0
          fi
          unexpected=$(echo "$all_warnings" | grep -Ev "$allowed" || true)

          echo "--- all WARNINGs reported ---"
          echo "$all_warnings"

          if [ -n "$unexpected" ]; then
            echo
            echo "::error::R CMD check reported unexpected WARNINGs:"
            echo "$unexpected"
            echo
            echo "Fix the warning or document and allowlist it explicitly."
            exit 1
          fi

          echo "All reported WARNINGs are on the justified list."
