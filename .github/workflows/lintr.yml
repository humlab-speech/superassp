name: lintr

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '35 8 * * 5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lintr:
    name: Run lintr scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2.12.1

      - name: Setup lintr
        uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          # The GitHub-only Suggests is named in the list below: CRAN
          # forbids the Remotes: field, and pak cannot solve pladdrr from
          # the repositories alone. The pladdrr tests skip when it is absent.
          extra-packages: |
            github::humlab-speech/pladdrr
            any::lintr

      - name: Run lintr
        run: lintr::sarif_output(lintr::lint_dir('.'), 'lintr-results.sarif')
        shell: Rscript {0}
        continue-on-error: true

      - name: Fix invalid SARIF columns from lintr
        run: |
          jq '(.. | .startColumn? // empty | select(. < 1)) |= 1
              | (.. | .endColumn? // empty | select(. < 1)) |= 1' \
            lintr-results.sarif > lintr-results-fixed.sarif
          mv lintr-results-fixed.sarif lintr-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lintr-results.sarif
          wait-for-processing: true
