name: pkgcheck

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Manual only. This runs rOpenSci's pkgcheck, which installs the package's
  # dependencies -- it stops today on the GitHub-only pladdrr Suggests -- and
  # then fails on any finding, so wiring it to a branch would only add a red
  # workflow. Invoke it deliberately with `gh workflow run pkgcheck.yaml`.
  # (The previous trigger watched `main`, a branch this repository does not
  # have, so the workflow had never run.)
  workflow_dispatch:

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: docker://alpine/git
        with:
          args: config --global --add safe.directory /github/workspace
      - uses: ropensci-review-tools/pkgcheck-action@fa6dc3e9dec0580397ae44ec6fb9e7953947758c
        with:
          ref: ''
